<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="bg-primary text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3">Shopping Cart</h1>
      <div class="cart-info">
        <span>Cart Items: <span id="cart-count" class="badge bg-light text-dark">0</span></span>
        <button class="btn btn-light btn-sm" id="view-cart">View Cart</button>
      </div>
    </div>
  </header>

  <!-- Product List -->                                               
  <main class="container mt-4">       
    <section id="product-list" class="row gy-4">      
      <!-- Products will be dynamically added here -->    
    </section>      
  </main>

  <!-- Cart Section -->
  <section id="cart" class="container mt-5 hidden">
    <h2>Your Cart</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- Cart items will be dynamically added here -->
      </tbody>
    </table>
    <div class="text-end">
      <p class="fs-5">Total: $<span id="total-price">0.00</span></p>
      <button id="clear-cart" class="btn btn-danger">Clear Cart</button>
      <!-- Add Promo Code Section in Checkout -->
      <div id="promo-section" class="mt-3">
        <input type="text" id="promo-code" class="form-control" placeholder="Enter promo code">
        <button id="apply-promo" class="btn btn-primary mt-2">Checkout</button>
        <p id="promo-message" class="mt-2"></p>
      </div>
      <div class="text-end mt-3">
        <p class="fs-5">Subtotal: $<span id="subtotal-price">0.00</span></p>
        <p class="fs-5">Discount: $<span id="discount-price">0.00</span></p>
        <p class="fs-5">Final Total: $<span id="final-price">0.00</span></p>
      </div>

      <!-- <button id="checkout" class="btn btn-success">Checkout</button> -->
    </div>
  </section>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
